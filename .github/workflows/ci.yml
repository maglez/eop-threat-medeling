name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A weekly run, for the `supply-chain` job's sake. Everything else here
  # is a function of a commit, so running it on a commit is sufficient - but
  # an advisory is published by someone else, against code that has not
  # changed, so a check that only ever fires when we push cannot see one
  # arrive. This is the trigger that makes the supply-chain job an actual
  # tripwire rather than a slower way of learning the same thing at merge
  # time.
  #
  # The other three jobs run too. That is deliberate and not a side effect
  # worth suppressing: a weekly green on `build`, `ui` and `image` is a
  # canary for breakage that arrives from outside the repository - a base
  # image moving, an action deprecating, a registry changing - which is
  # otherwise discovered by whoever happens to push next. Nothing is
  # published, because the GHCR step is gated on `github.event_name ==
  # 'push'`.
  schedule:
    - cron: '0 6 * * 1'
  # Manual trigger, so the audit can be run on demand after a pin moves
  # without waiting for Monday or inventing a commit.
  workflow_dispatch:

# Least privilege, stated explicitly. The repository default is already
# `read`, so this changes nothing today - but it means a job added later
# cannot quietly inherit more than it needs, and it makes the one job that
# does need write scope declare it locally.
permissions:
  contents: read

jobs:
  # The only required status check on `main`. Keep it fast and keep it
  # about the code.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cache the local Maven repository so dependency downloads do not
      # dominate build time. The key includes the pom.xml hash so the cache
      # is invalidated automatically when dependencies change. The restore-key
      # falls back to any prior Maven cache for the same OS, which still saves
      # most of the download time even after a pom.xml change.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # The Maven Wrapper, not a system `mvn`. The wrapper pins the Maven
      # version; `mvn` is whatever the runner image happens to ship.
      - name: Build and test
        run: ./mvnw verify --batch-mode

      # `./mvnw verify` cannot gate its own output: surefire binds to `test`,
      # which runs before `package`, so no JUnit test can inspect the
      # repackaged jar. This step is therefore the only thing standing between
      # a lost `<excludes>` block in `pom.xml` and H2's 13 `org.h2.server.web`
      # classes going back inside the artifact that runs on a server. It sits
      # before `Upload artifact` on purpose, so nothing unverified is published,
      # and inside `build` because that is the only required check on `main`.
      # See docs/adr/ADR-047-h2-excluded-from-deployable-artifact.md.
      - name: Assert no H2 in the deployable artifact
        run: tools/artifact/assert-no-h2-in-jar.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # The front end gets its own gate rather than being bolted onto `build`.
  # Two reasons: `build` is the single required check protecting `main`, so
  # it should stay Java-only and fast and must not fail for a lint rule in
  # a TypeScript file; and a front-end failure should report as a front-end
  # failure rather than as a mysterious red mark on the Java job.
  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `ci`, not `install`: it installs exactly the locked tree and fails
      # if the lockfile and the manifest disagree, rather than silently
      # resolving something new.
      - name: Install dependencies
        run: npm ci

      # Four separate steps rather than the chained `npm run verify`, so a
      # failure names itself in the job summary instead of hiding inside
      # one opaque command.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Deliberately NOT a required status check yet. It lands as an ordinary
  # job so its reliability can be observed over a few runs; promoting it
  # to required is a separate, deliberate branch-protection change.
  #
  # Gated on both code jobs: this one publishes both images, so neither
  # should be published unless both quality gates passed.
  image:
    name: image
    needs: [ build, ui ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only to publish to GHCR, and only by this job. No
      # repository secret is involved: the built-in GITHUB_TOKEN is
      # enough, which is why this repository still has zero secrets.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # linux/amd64 explicitly. The instance is t3.small, which is x86_64,
      # and a developer laptop on Apple Silicon would otherwise produce an
      # arm64 image that cannot run there. Only CI publishes the image that
      # gets deployed.
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: eop-threat-medeling:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # The proxy image. It carries the built front end and the Caddy
      # configuration, so it is the only thing that publishes a port
      # (ADR-017). Its own build context is `ui/`, which keeps the
      # front-end build out of the application image entirely.
      - name: Build front-end image
        uses: docker/build-push-action@v6
        with:
          context: ui
          platforms: linux/amd64
          load: true
          tags: eop-ui:ci
          # Both are build-time flags (ADR-037). The ARG defaults in ui/Dockerfile
          # are false (fail-closed); these explicit overrides enable the game
          # screen and the card magnifier in the CI-built and deployed image.
          # Change either to false to ship that feature dark.
          build-args: |
            VITE_GAME_SCREEN_ENABLED=true
            VITE_CARD_MAGNIFIER_ENABLED=true
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      # Nothing before this point proves the artifact starts. `mvn verify`
      # proves the code compiles and the tests pass; the build proves the
      # image assembles. This proves the application boots, runs Liquibase
      # against a real PostgreSQL and serves traffic - which is what makes
      # the walking skeleton honest.
      - name: Smoke test
        env:
          APP_IMAGE: eop-threat-medeling:ci
          UI_IMAGE: eop-ui:ci
          POSTGRES_DB: eop
          POSTGRES_USER: eop
          # Ephemeral, lives for the duration of one job, reachable only
          # from inside the Compose network. Not a secret.
          POSTGRES_PASSWORD: smoke-test-throwaway
        run: |
          set -euo pipefail

          docker compose -f compose.app.yml up -d

          # Port 443 through Caddy (EOP-21; was port 80). The application container
          # publishes no host port at all (ADR-017), so this is the only way in —
          # which is exactly why the test goes this way: hitting the application
          # directly would prove the application works and prove nothing about the
          # proxy that every real request passes through.
          #
          # The Caddy local CA certificate is self-signed (tls internal). curl's
          # --insecure flag disables certificate verification, which is acceptable
          # in CI where the goal is to prove the stack starts and serves traffic,
          # not to validate the certificate chain. The hostname must be `localhost`
          # (not 127.0.0.1) because the site address is `localhost:8080` and Caddy
          # only presents the certificate for that SNI name.
          healthy=false
          for _ in $(seq 1 60); do
            if [ "$(curl -fsSk https://localhost/health 2>/dev/null || true)" = "OK" ]; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "::error::The stack never served OK on /health through the proxy"
            docker compose -f compose.app.yml ps
            docker compose -f compose.app.yml logs --no-color
            exit 1
          fi

          echo "GET /health returned OK through the proxy"

          # The site root must serve the front end, not fall through to the
          # API. A proxy that answers /health but 404s the site would pass
          # the check above and still be broken for every user.
          root_status="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)"
          if [ "$root_status" != 200 ]; then
            echo "::error::The site root returned $root_status, expected 200"
            docker compose -f compose.app.yml logs --no-color caddy
            exit 1
          fi

          echo "GET / returned 200"

          # And the API must be reachable on the same origin. This is the
          # single-origin property from ADR-017 asserted rather than
          # assumed - if it regressed, the browser would need CORS.
          if ! curl -fsSk 'https://localhost/api/v1/cards?size=1' | grep -q '"totalElements":68'; then
            echo "::error::The card catalogue was not reachable through the proxy"
            docker compose -f compose.app.yml logs --no-color
            exit 1
          fi

          echo "GET /api/v1/cards returned the seeded deck"
          docker compose -f compose.app.yml down --volumes

      # Publish only from `main`. A pull request builds and smoke tests the
      # image but never publishes one, so an unreviewed change can never
      # become a deployable tag.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # GHCR rejects uppercase in a repository path. This one is
          # already lowercase; the guard costs nothing and survives a
          # rename.
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # The commit SHA is the immutable, deployable reference - it is
          # what `app_image` and `ui_image` in infra/terraform.tfvars should
          # point at. `latest` is a convenience for humans and moves under
          # you.
          #
          # Two images, both tagged with the same SHA, because they are
          # deployed together and a mismatched pair is a class of bug worth
          # making impossible to express.
          for tag in "${{ github.sha }}" latest; do
            docker tag eop-threat-medeling:ci "$repo:$tag"
            docker push "$repo:$tag"

            docker tag eop-ui:ci "$repo-ui:$tag"
            docker push "$repo-ui:$tag"
          done

          echo "Published $repo:${{ github.sha }}"
          echo "Published $repo-ui:${{ github.sha }}"

  # Supply-chain tripwire for the OpenCode plugin roster. This job exists
  # because the prose version of it did not work: SETUP.md carried a
  # "re-run `npm audit` whenever a pin moves" instruction that fired four
  # times and was honoured once, and one of the firings it missed was a
  # commit that edited the very paragraph recording the trigger as
  # unhonoured. Prose does not run. This job does.
  #
  # What it guards is not the shipped Java application - that has no npm
  # dependencies at all. It guards the six plugins pinned in the `plugin`
  # array of `.opencode/opencode.json`, which load in-process inside
  # OpenCode with sight of every message and file on a developer machine
  # and no sandbox. That is a wider blast radius than anything in `pom.xml`,
  # and until now it was the only dependency set with no automated check.
  #
  # Deliberately NOT a required status check. `build` is the single required
  # gate on `main` and must stay about the code: a new advisory published
  # against a transitive dependency of a developer tool is a thing to know
  # about, not a reason to block a merge of unrelated application code. Let
  # it run as an ordinary job, watch it, and promote it only if that
  # judgement turns out to be wrong.
  #
  # Failure conditions are drift and severity, in that order of interest:
  # a maintainer account change, a provenance-attestation change, a roster
  # spec that lost its exact version, or a high/critical advisory. Low and
  # moderate findings are reported and tolerated - SETUP.md holds the
  # accepted residual and the reasons.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    # Reads the registry and the repository. Writes nothing anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` here, and that is deliberate rather than an
      # oversight. The manifest this job audits is generated at run time
      # from the pinned specs and there is no lockfile to key a cache on;
      # more to the point, a cached dependency tree is exactly the wrong
      # thing for an audit that is supposed to observe what the registry
      # serves today.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit pinned OpenCode plugins
        run: tools/supply-chain/audit-plugins.sh

  # CVE scanning for the two dependency trees the application actually
  # ships: the Maven tree resolved from `pom.xml`, and the npm tree locked
  # by `ui/package-lock.json`. Before EOP-89 there was none, anywhere - the
  # enforcer covered dependency *convergence* and banned coordinates, which
  # is supply-chain hygiene but is not CVE detection, so a transitive with a
  # published critical passed every gate the project had. It was not a
  # theoretical gap: the first run of this scanner against `main` found six
  # findings, one of them a HIGH in a directly-declared runtime dependency
  # (`org.postgresql:postgresql`, CVE-2026-54291). All six were closed by
  # patch-level version overrides in `pom.xml` before this job landed, which
  # is why it is green on arrival - a gate that is red the day it appears
  # gets switched off rather than fixed.
  #
  # Note the division of labour with `supply-chain` above, which is a
  # different job about a different tree and is not redundant with this one.
  # That one audits the OpenCode *developer plugins* and checks more than
  # CVEs there (maintainer continuity, provenance attestations, npm
  # signatures); this one audits the *deployed application* and checks only
  # CVEs. This job therefore skips `.opencode/` and `tools/` deliberately:
  # two gating scanners over one tree would mean two allowlists to keep in
  # step, and the first divergence would be silent.
  #
  # Deliberately NOT a required status check when it lands - but for a
  # weaker reason than the `supply-chain` job's, and the difference is worth
  # keeping straight rather than inheriting. That job's argument is that an
  # advisory against a developer tool "is a thing to know about, not a
  # reason to block a merge"; that argument does not transfer here, because
  # these dependencies are executed in production by users. The reason this
  # one is not required yet is narrower: a CVE gate goes red on a
  # publication by a third party against code that has not changed, so
  # making it required means an unrelated PR can be blocked by someone
  # else's release schedule. `tools/supply-chain/accepted-cves.json` exists
  # precisely so that situation has an answer other than disabling the
  # scanner, and once that mechanism has been exercised in anger a couple of
  # times, promoting this to required is the intended end state. Two honest
  # caveats on that: branch protection is configured outside this file, so
  # no comment here can make the job required or stop it being required;
  # and the job exits non-zero and shows red on a gating finding either way,
  # so "not required" affects whether a merge is blocked, never whether the
  # finding is visible.
  #
  # Failure policy, in full, is HIGH and CRITICAL only. That matches the
  # `audit-plugins.sh` gating set exactly and diverges from the SpotBugs
  # posture in `build-quality.md`, which fails on high *and medium*. The
  # divergence is deliberate: a medium SpotBugs finding is in our own code
  # and is always actionable, whereas a medium CVE in a third-party
  # transitive is frequently unreachable, often has no in-range fix, and
  # arrives at a volume set by other people's release cadence. Medium and
  # low findings are printed in their own non-gating section. See ADR-050.
  dependency-cve:
    name: dependency-cve
    runs-on: ubuntu-latest
    # Reads the repository, the vulnerability database and Maven Central.
    # Writes nothing anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No `setup-java` and no `setup-node`, which looks like an omission
      # and is not. Trivy resolves the Maven tree with its own parser,
      # fetching parent and dependency POMs from Central over HTTP rather
      # than invoking Maven, and it reads `ui/package-lock.json` as a file
      # rather than installing it. Nothing here needs a JDK or a Node
      # runtime. The consequence to be aware of is that the scan depends on
      # Maven Central being reachable: if Central is down this job fails
      # rather than silently under-reporting, which is the safe direction.

      # Pinned by version *and* by the SHA-256 of the release asset, rather
      # than installed through a third-party action. Both halves are
      # deliberate. A `setup-trivy`-style action would add another
      # unpinned-by-default dependency to the very job whose purpose is
      # dependency hygiene; and pinning only the version still trusts
      # whatever bytes that tag serves today. What the digest does and does
      # not prove is worth being exact about: it detects a corrupted
      # download or a tampered mirror, and it does NOT prove the release
      # itself is benign - if upstream published a backdoored 0.74.0, this
      # check passes. Bumping the version means replacing both values
      # together, from
      # https://github.com/aquasecurity/trivy/releases/download/v<ver>/trivy_<ver>_checksums.txt
      - name: Install Trivy 0.74.0
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          curl -sSfL -o "$asset" "$url"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum --check --strict
          tar -xzf "$asset" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy "$asset"
          trivy --version

      # The vulnerability database is ~109 MiB and is the single largest
      # cost in this job, so it is cached - but note what the cache is and
      # is not. It is an optimisation, never a correctness control: Trivy
      # checks the database's own age and refreshes it when stale, so a
      # cache hit reduces bytes transferred rather than pinning the job to
      # yesterday's advisories. That is why the key must NOT be
      # `hashFiles('**/pom.xml')`, the reflex for a Maven cache - the
      # database ages on a clock of its own, entirely independently of
      # whether our dependencies changed, and keying it to `pom.xml` would
      # hold a stale database for as long as nobody edited the POM.
      #
      # Keyed by UTC date so the full download happens at most once a day,
      # with a bare prefix restore-key so a first-run-of-the-day miss still
      # restores yesterday's database and updates it incrementally instead
      # of pulling the whole thing.
      - name: Compute cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.cache-date.outputs.date }}
          restore-keys: trivy-db-

      # Two passes, and the second one cannot fail the job. Trivy's default
      # is to suppress development and test dependencies, so pass one sees
      # only what ships and is the pass that gates; pass two re-runs with
      # `--include-dev-deps` and prints whatever is visible only at build
      # time - the UI's dev tree is 331 of its 337 packages, and a finding
      # in a test-scoped Maven artifact never reaches production. Knowing
      # about those is useful; blocking on them is not. Both passes, the
      # allowlist gating and the exit-code contract (0 clean, 1 gating
      # finding or allowlist drift, 2 could not run) live in the script, so
      # the same command reproduces this job locally.
      #
      # Runtime, measured on EOP-89: 4.75 s warm, plus roughly 6 s of
      # database download on a cold cache. It is not the reason the CI wall
      # clock is what it is, and needs no scheduled-only treatment - though
      # the workflow's weekly cron covers this job too, which is the trigger
      # that catches an advisory published against dependencies we have not
      # touched.
      - name: Scan application dependency trees for known CVEs
        run: tools/supply-chain/scan-dependencies.sh
