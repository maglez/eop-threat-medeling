name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A weekly run, for the `supply-chain` job's sake. Everything else here
  # is a function of a commit, so running it on a commit is sufficient - but
  # an advisory is published by someone else, against code that has not
  # changed, so a check that only ever fires when we push cannot see one
  # arrive. This is the trigger that makes the supply-chain job an actual
  # tripwire rather than a slower way of learning the same thing at merge
  # time.
  #
  # The other three jobs run too. That is deliberate and not a side effect
  # worth suppressing: a weekly green on `build`, `ui` and `image` is a
  # canary for breakage that arrives from outside the repository - a base
  # image moving, an action deprecating, a registry changing - which is
  # otherwise discovered by whoever happens to push next. Nothing is
  # published, because the GHCR step is gated on `github.event_name ==
  # 'push'`.
  schedule:
    - cron: '0 6 * * 1'
  # Manual trigger, so the audit can be run on demand after a pin moves
  # without waiting for Monday or inventing a commit.
  workflow_dispatch:

# Least privilege, stated explicitly. The repository default is already
# `read`, so this changes nothing today - but it means a job added later
# cannot quietly inherit more than it needs, and it makes the one job that
# does need write scope declare it locally.
permissions:
  contents: read

jobs:
  # The only required status check on `main`. Keep it fast and keep it
  # about the code.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cache the local Maven repository so dependency downloads do not
      # dominate build time. The key includes the pom.xml hash so the cache
      # is invalidated automatically when dependencies change. The restore-key
      # falls back to any prior Maven cache for the same OS, which still saves
      # most of the download time even after a pom.xml change.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # The Maven Wrapper, not a system `mvn`. The wrapper pins the Maven
      # version; `mvn` is whatever the runner image happens to ship.
      - name: Build and test
        run: ./mvnw verify --batch-mode

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # The front end gets its own gate rather than being bolted onto `build`.
  # Two reasons: `build` is the single required check protecting `main`, so
  # it should stay Java-only and fast and must not fail for a lint rule in
  # a TypeScript file; and a front-end failure should report as a front-end
  # failure rather than as a mysterious red mark on the Java job.
  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `ci`, not `install`: it installs exactly the locked tree and fails
      # if the lockfile and the manifest disagree, rather than silently
      # resolving something new.
      - name: Install dependencies
        run: npm ci

      # Four separate steps rather than the chained `npm run verify`, so a
      # failure names itself in the job summary instead of hiding inside
      # one opaque command.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Deliberately NOT a required status check yet. It lands as an ordinary
  # job so its reliability can be observed over a few runs; promoting it
  # to required is a separate, deliberate branch-protection change.
  #
  # Gated on both code jobs: this one publishes both images, so neither
  # should be published unless both quality gates passed.
  image:
    name: image
    needs: [ build, ui ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only to publish to GHCR, and only by this job. No
      # repository secret is involved: the built-in GITHUB_TOKEN is
      # enough, which is why this repository still has zero secrets.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # linux/amd64 explicitly. The instance is t3.small, which is x86_64,
      # and a developer laptop on Apple Silicon would otherwise produce an
      # arm64 image that cannot run there. Only CI publishes the image that
      # gets deployed.
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: eop-threat-medeling:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # The proxy image. It carries the built front end and the Caddy
      # configuration, so it is the only thing that publishes a port
      # (ADR-017). Its own build context is `ui/`, which keeps the
      # front-end build out of the application image entirely.
      - name: Build front-end image
        uses: docker/build-push-action@v6
        with:
          context: ui
          platforms: linux/amd64
          load: true
          tags: eop-ui:ci
          # VITE_GAME_SCREEN_ENABLED is a build-time flag (ADR-037). The ARG
          # default in ui/Dockerfile is false (fail-closed); this explicit
          # override enables the game screen in the CI-built and deployed image.
          # Change this to false to ship a dark build.
          build-args: VITE_GAME_SCREEN_ENABLED=true
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      # Nothing before this point proves the artifact starts. `mvn verify`
      # proves the code compiles and the tests pass; the build proves the
      # image assembles. This proves the application boots, runs Liquibase
      # against a real PostgreSQL and serves traffic - which is what makes
      # the walking skeleton honest.
      - name: Smoke test
        env:
          APP_IMAGE: eop-threat-medeling:ci
          UI_IMAGE: eop-ui:ci
          POSTGRES_DB: eop
          POSTGRES_USER: eop
          # Ephemeral, lives for the duration of one job, reachable only
          # from inside the Compose network. Not a secret.
          POSTGRES_PASSWORD: smoke-test-throwaway
        run: |
          set -euo pipefail

          docker compose -f compose.app.yml up -d

          # Port 443 through Caddy (EOP-21; was port 80). The application container
          # publishes no host port at all (ADR-017), so this is the only way in —
          # which is exactly why the test goes this way: hitting the application
          # directly would prove the application works and prove nothing about the
          # proxy that every real request passes through.
          #
          # The Caddy local CA certificate is self-signed (tls internal). curl's
          # --insecure flag disables certificate verification, which is acceptable
          # in CI where the goal is to prove the stack starts and serves traffic,
          # not to validate the certificate chain. The hostname must be `localhost`
          # (not 127.0.0.1) because the site address is `localhost:8080` and Caddy
          # only presents the certificate for that SNI name.
          healthy=false
          for _ in $(seq 1 60); do
            if [ "$(curl -fsSk https://localhost/health 2>/dev/null || true)" = "OK" ]; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "::error::The stack never served OK on /health through the proxy"
            docker compose -f compose.app.yml ps
            docker compose -f compose.app.yml logs --no-color
            exit 1
          fi

          echo "GET /health returned OK through the proxy"

          # The site root must serve the front end, not fall through to the
          # API. A proxy that answers /health but 404s the site would pass
          # the check above and still be broken for every user.
          root_status="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)"
          if [ "$root_status" != 200 ]; then
            echo "::error::The site root returned $root_status, expected 200"
            docker compose -f compose.app.yml logs --no-color caddy
            exit 1
          fi

          echo "GET / returned 200"

          # And the API must be reachable on the same origin. This is the
          # single-origin property from ADR-017 asserted rather than
          # assumed - if it regressed, the browser would need CORS.
          if ! curl -fsSk 'https://localhost/api/v1/cards?size=1' | grep -q '"totalElements":68'; then
            echo "::error::The card catalogue was not reachable through the proxy"
            docker compose -f compose.app.yml logs --no-color
            exit 1
          fi

          echo "GET /api/v1/cards returned the seeded deck"
          docker compose -f compose.app.yml down --volumes

      # Publish only from `main`. A pull request builds and smoke tests the
      # image but never publishes one, so an unreviewed change can never
      # become a deployable tag.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # GHCR rejects uppercase in a repository path. This one is
          # already lowercase; the guard costs nothing and survives a
          # rename.
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # The commit SHA is the immutable, deployable reference - it is
          # what `app_image` and `ui_image` in infra/terraform.tfvars should
          # point at. `latest` is a convenience for humans and moves under
          # you.
          #
          # Two images, both tagged with the same SHA, because they are
          # deployed together and a mismatched pair is a class of bug worth
          # making impossible to express.
          for tag in "${{ github.sha }}" latest; do
            docker tag eop-threat-medeling:ci "$repo:$tag"
            docker push "$repo:$tag"

            docker tag eop-ui:ci "$repo-ui:$tag"
            docker push "$repo-ui:$tag"
          done

          echo "Published $repo:${{ github.sha }}"
          echo "Published $repo-ui:${{ github.sha }}"

  # Supply-chain tripwire for the OpenCode plugin roster. This job exists
  # because the prose version of it did not work: SETUP.md carried a
  # "re-run `npm audit` whenever a pin moves" instruction that fired four
  # times and was honoured once, and one of the firings it missed was a
  # commit that edited the very paragraph recording the trigger as
  # unhonoured. Prose does not run. This job does.
  #
  # What it guards is not the shipped Java application - that has no npm
  # dependencies at all. It guards the six plugins pinned in the `plugin`
  # array of `.opencode/opencode.json`, which load in-process inside
  # OpenCode with sight of every message and file on a developer machine
  # and no sandbox. That is a wider blast radius than anything in `pom.xml`,
  # and until now it was the only dependency set with no automated check.
  #
  # Deliberately NOT a required status check. `build` is the single required
  # gate on `main` and must stay about the code: a new advisory published
  # against a transitive dependency of a developer tool is a thing to know
  # about, not a reason to block a merge of unrelated application code. Let
  # it run as an ordinary job, watch it, and promote it only if that
  # judgement turns out to be wrong.
  #
  # Failure conditions are drift and severity, in that order of interest:
  # a maintainer account change, a provenance-attestation change, a roster
  # spec that lost its exact version, or a high/critical advisory. Low and
  # moderate findings are reported and tolerated - SETUP.md holds the
  # accepted residual and the reasons.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    # Reads the registry and the repository. Writes nothing anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` here, and that is deliberate rather than an
      # oversight. The manifest this job audits is generated at run time
      # from the pinned specs and there is no lockfile to key a cache on;
      # more to the point, a cached dependency tree is exactly the wrong
      # thing for an audit that is supposed to observe what the registry
      # serves today.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit pinned OpenCode plugins
        run: tools/supply-chain/audit-plugins.sh
