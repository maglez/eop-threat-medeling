# Project namespace, set explicitly. Without it Compose derives the project name
# from the directory, both files collide, and each stack reports the other's
# containers as orphans - so `docker compose down --remove-orphans` on one file
# would destroy the other stack.
name: eop-monitoring

services:
  influxdb:
    image: influxdb:1.8
    container_name: eop-influxdb
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_DB: k6
      # HTTP auth is deliberately OFF. The port above binds to 127.0.0.1 only, so
      # this database is reachable from this machine and nowhere else, and it holds
      # load-test timing metrics - no application or personal data. Turning auth on
      # bought no confidentiality against that threat model but did require every
      # writer to carry credentials: k6 is driven by `--out influxdb=$INFLUXDB_URL`,
      # so the only way to authenticate it is to embed a password in a URL that gets
      # echoed to the terminal by test/k6/run.sh. Auth was on from 2026-07-27 to
      # 2026-08-23 and k6 wrote nothing at all for that entire period. See ADR-016.
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: eop-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      # No INFLUXDB_* variables here on purpose. Grafana reaches InfluxDB over the
      # Compose network at a fixed address that is hardcoded in the provisioned
      # datasource; passing the host-facing ${INFLUXDB_URL} in was the reason the
      # dashboard could never load data. See tools/monitoring/grafana/datasources/.
    volumes:
      - ./tools/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./tools/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb_data:
  grafana_data:
