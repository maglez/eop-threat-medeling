server:
  port: 8080
  # Explicitly pinned (EOP-26, ADR-021). The application resolves the client address itself via
  # ClientAddressResolver against an explicit allow-list; letting the container or framework
  # rewrite getRemoteAddr() from headers would undermine that, because both alternatives trust
  # wide private ranges by default and one of those ranges contains our own Compose subnet;
  # so the value is pinned rather than left to a default. NONE is already the effective default
  # and pinning it is the point - the property exists so a future well-intentioned "we're behind
  # a proxy now" change cannot silently re-open EOP-26.
  forward-headers-strategy: none

spring:
  application:
    name: eop-threat-medeling
  datasource:
    url: ${DB_URL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      # Fail closed (EOP-27). This said `true` until now, which read as an
      # unauthenticated arbitrary-SQL endpoint on every default-profile start: the H2
      # console lets the caller supply the JDBC URL, which is the CVE-2021-42392
      # JNDI/RCE class of exposure, and there is no Spring Security dependency in this
      # project that could have stood in front of it.
      #
      # It was, in fact, never served. Spring Boot 4 moved the console's
      # autoconfiguration out of spring-boot-autoconfigure into a separate
      # `org.springframework.boot:spring-boot-h2console` module, and nothing here
      # depends on it, so no class ever read this property. That makes the old `true`
      # a loaded gun rather than a fired one — one transitive dependency, or one
      # developer adding the module for convenience, and the exposure would have
      # arrived silently with no review, because the configuration already said yes.
      #
      # So this stays as an explicit `false` rather than being deleted. It is the
      # standing answer for the day the module appears: whoever adds it has to change
      # a line that says why it is off, instead of inheriting a default. There is
      # deliberately no profile and no property that turns it on — ADR-012 keeps the
      # profile set at {default, prod} so local and deployed runs execute identical
      # configuration, and adding a working opt-in would mean adding the module, which
      # is a decision for its own ticket and not a side effect of this one.
      #
      # H2ConsoleAbsentIntegrationTest is the tripwire: it fails if the module ever
      # lands, so the conversation happens at review time rather than in an incident.
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mvc:
    async:
      # SSE stream lifetime cap, matching SseSessionEventPublisher.EMITTER_TIMEOUT_MILLIS (EOP-20, ADR-034).
      # The servlet container closes a connection that has been open for this many milliseconds even if
      # the heartbeat sweep has not yet triggered the onTimeout callback. 600 000 ms = 10 minutes.
      request-timeout: 600000

eop:
  web:
    # Peers whose X-Forwarded-For header is believed, as literal addresses or CIDR
    # blocks (ADR-021). Empty means nobody, so the header is ignored and the real
    # peer address is used instead. That is the correct answer everywhere the
    # application is reached without a reverse proxy in front of it: locally, in
    # tests, and from a sibling container. Before EOP-26 the header was read
    # unconditionally, which let any caller nominate its own rate-limiter bucket and
    # rotate it once per guess, defeating the join throttle ADR-019 depends on.
    #
    # The deployed value is set on the app service in compose.app.yml, beside the
    # fixed address of the proxy it has to match. A malformed entry fails startup.
    trusted-proxies: []

    # Maximum successful session creations one client address may make in a 60-second
    # window before receiving HTTP 429 (EOP-19, ADR-033). The default of 5 is the
    # production limit. Override to Integer.MAX_VALUE in
    # src/test/resources/application.properties so the shared Spring context is not
    # exhausted across integration tests (all of which call createSession).
    # Body-size cap: Caddy enforces request_body { max_size 16KB } on /api/* before
    # requests reach the application. There is no application-level body cap; direct
    # access bypasses Caddy and is unprotected. See ADR-033 for the rationale.
    session-creation-limit: 5

    # Read-route rate limiting (EOP-88, ADR-051). Applied by a HandlerInterceptor to
    # every GET and HEAD under /api/v1/**, keyed on the resolved client address — the
    # same key the creation and join limiters use, so no request header can influence
    # it while trusted-proxies is empty. The SSE stream is excluded: it is an async
    # dispatch that preHandle sees twice, and its cost is already bounded by the
    # per-session subscriber cap (ADR-034).
    #
    # Before EOP-88 no read route was limited at all. GET /leaderboard re-derives
    # every score from the session's whole trick history on each call (ADR-030), and
    # the game-over screen offers a retry button that issues one such read per click.
    read-rate-limit:
      # Reads admitted per address per 60-second window before HTTP 429. 300 is
      # generous by design: the key is an address, so a household behind one NAT
      # shares one allowance, and a three-player game on that NAT peaks near 100
      # reads a minute (about 66 trick events, each waking roughly two re-fetches
      # per client, ADR-014). Override it in
      # src/test/resources/application.properties so the shared Spring context is
      # not exhausted across integration tests; the tests that assert the 429 pin a
      # low limit per class with @DirtiesContext instead of forging the key.
      limit: 300

      # Distinct addresses tracked at once. On reaching it the limiter evicts expired
      # windows and, if still full, refuses new keys rather than admitting requests it
      # cannot count — a flood of distinct keys is itself an attack pattern, and
      # admitting the untrackable would let an attacker bypass the limiter by
      # exhausting the table first (ADR-033).
      max-tracked-keys: 10000

  # Feature flags (ADR-013). New flags default to false so that forgetting to think
  # about one fails closed. A flag is bound at startup, so flipping it restarts the
  # application; in a container that means setting EOP_FEATURES_SESSION_LIFECYCLE
  # in the environment the container starts with, then
  # docker compose -f compose.app.yml up -d (ADR-016).
  # As of EOP-25 (2026-08-16), eop.features.session-lifecycle is true (permanent
  # rollout). As of EOP-70 (2026-08-17), eop.features.trick-play is true.
  # As of EOP-82 (2026-08-18), eop.features.game-over is true.
  features:
    # Session create, join, state, event stream and start (EOP-10). While this is
    # false neither the controller bean nor the create-session, join-session,
    # session-state and start-session beans exist, so every /api/v1/sessions path
    # returns the framework's own 404, nothing in the application can open or
    # mutate a session, and nothing else changes. resolve-player stays ungated on
    # purpose: it only reads, and the trick-play use cases depend on it (EOP-48,
    # ADR-013).
    #
    # Only the literal true turns this on. on, yes and 1 all read as off, because
    # the conditions carry havingValue = "true" -- flipping it with anything but
    # true is a silent no-op, which is the price of the flag failing closed.
    #
    # Enabled by EOP-25 (2026-08-16): all six gate stories (EOP-17 through EOP-22)
    # and the additional gate EOP-26 are Done. This is the permanent rollout; the
    # flag will be removed once the feature is confirmed stable (ADR-013).
    # Note: this also activates ExpiredSessionSweepScheduler (hourly, 5-min initial
    # delay). eop.features.trick-play is now true (EOP-70, 2026-08-17).
    session-lifecycle: true
    
    # Dealing the deck, playing a trick and resolving the winner (EOP-14). While this is
    # false the deal-hands, read-own-hand, play-card, trick-state, resolve-trick and
    # get-score beans do not exist, so nothing in the application calls the ports that write a hand, a
    # trick or a play, even though the tables and the ports are already there.
    # TrickController and ScoreController are gated on this same flag, so all six of
    # /deal, /hand, /plays, /tricks/current, /tricks/current/resolve and /score return
    # the framework's own 404 while it is off.
    #
    # Enabled by EOP-70 (2026-08-17): all predecessor stories and ADRs are discharged —
    # EOP-14 (trick-play domain), EOP-15 (Slice C, ADR-032), EOP-48 (commit 34d30d7),
    # and ADR-026 (use-case observability, now Accepted: option 4 chosen, audit logging
    # at the HTTP boundary in TrickController). The UI now calls POST /deal immediately
    # after POST /start, and GameScreen distinguishes a session-not-found 404 from a
    # HandNotDealtException 409.
    # Only the literal true turns this on (havingValue = "true" on all conditions).
    trick-play: true

    # Final leaderboard and "Start new game" action (EOP-65). While this is false the
    # leaderboard and new-game routes return the framework's own 404, and the
    # GetLeaderboardUseCase, PersistGameResultUseCase and NewGameUseCase beans do not exist.
    # The game_result and game_result_player tables are created by Liquibase regardless of
    # this flag; the flag only gates the application-level behaviour.
    #
    # Enabled by EOP-82 (2026-08-18): leaderboard and new-game are now live. While this
    # was false the leaderboard route returned Spring's static-resource 404 and
    # PersistGameResultUseCase never ran, so no GameResult row was ever written. The flag
    # will be removed once the feature is confirmed stable (ADR-013).
    game-over: true

  # Expired-session sweep configuration (ADR-036). These are infrastructure
  # toggles, not feature flags — they belong under eop.* directly rather than
  # eop.features.*. The sweep bean is only active when eop.features.session-lifecycle
  # is true; these values are ignored while the flag is off.
  sweep:
    # Interval between sweep runs in milliseconds. Default: 1 hour.
    interval-ms: 3600000
    # Initial delay before the first sweep run in milliseconds. Default: 5 minutes.
    initial-delay-ms: 300000

# Fail closed (EOP-38, ADR-049). Until now this file carried no springdoc block at all,
# so both surfaces were enabled by default and the *secure* configuration was the one you
# had to remember to ask for: hardening existed only in application-prod.yml, and therefore
# only when SPRING_PROFILES_ACTIVE=prod was set. That inverts the rule in
# .opencode/rules/security.md — "fail securely, default-denied access" — because omission
# produced the permissive state. It was not hypothetical: on the default profile
# GET /v3/api-docs returned 200 with 18,739 bytes of schema, /swagger-ui/index.html
# returned 200, and /swagger-ui.html redirected to it.
#
# The two surfaces are now off in the base, so every profile inherits the safe value and
# the container needs no configuration to be hardened. Note application.yml is NOT a
# local-only file: Spring always loads it and application-prod.yml overrides only the keys
# it names, which is the same mechanism that makes the eop.features.* values here
# authoritative in production (ADR-013, ADR-042).
#
# Local opt-in, because a control nobody can satisfy is a control people disable: set
# SPRINGDOC_APIDOCS_ENABLED=true and SPRINGDOC_SWAGGERUI_ENABLED=true. Both are in
# .env.example and .envrc runs `dotenv`, so a developer who copied .env.example keeps
# Swagger UI on `./mvnw spring-boot:run` with no extra ceremony. The container never sees
# them: compose.app.yml has no `env_file:`, so .env is used only for ${...} interpolation
# in the Compose file itself and is not injected into the app container.
#
# Turning the generated schema off costs nothing contractually. This project is
# contract-first (ADR-004): the hand-authored docs/api/openapi.yml is the contract, and the
# runtime /v3/api-docs is a generated convenience — docs/api/openapi.yml says so itself.
#
# Deliberately still pinned in application-prod.yml as a second independent guard. Gated by
# SpringdocDisabledByDefaultIntegrationTest (the disabled path) and SpringdocOptInIntegrationTest
# (the opt-in path). Both are needed: a suite that can only observe absence cannot tell a working
# control from a broken feature, so without the second test "disabled" could be satisfied by
# springdoc simply being broken.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
