server:
  port: 8080
  # Explicitly pinned (EOP-26, ADR-021). The application resolves the client address itself via
  # ClientAddressResolver against an explicit allow-list; letting the container or framework
  # rewrite getRemoteAddr() from headers would undermine that, because both alternatives trust
  # wide private ranges by default and one of those ranges contains our own Compose subnet;
  # so the value is pinned rather than left to a default. NONE is already the effective default
  # and pinning it is the point - the property exists so a future well-intentioned "we're behind
  # a proxy now" change cannot silently re-open EOP-26.
  forward-headers-strategy: none

spring:
  application:
    name: eop-threat-medeling
  datasource:
    url: ${DB_URL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      # Fail closed (EOP-27). This said `true` until now, which read as an
      # unauthenticated arbitrary-SQL endpoint on every default-profile start: the H2
      # console lets the caller supply the JDBC URL, which is the CVE-2021-42392
      # JNDI/RCE class of exposure, and there is no Spring Security dependency in this
      # project that could have stood in front of it.
      #
      # It was, in fact, never served. Spring Boot 4 moved the console's
      # autoconfiguration out of spring-boot-autoconfigure into a separate
      # `org.springframework.boot:spring-boot-h2console` module, and nothing here
      # depends on it, so no class ever read this property. That makes the old `true`
      # a loaded gun rather than a fired one — one transitive dependency, or one
      # developer adding the module for convenience, and the exposure would have
      # arrived silently with no review, because the configuration already said yes.
      #
      # So this stays as an explicit `false` rather than being deleted. It is the
      # standing answer for the day the module appears: whoever adds it has to change
      # a line that says why it is off, instead of inheriting a default. There is
      # deliberately no profile and no property that turns it on — ADR-012 keeps the
      # profile set at {default, prod} so local and deployed runs execute identical
      # configuration, and adding a working opt-in would mean adding the module, which
      # is a decision for its own ticket and not a side effect of this one.
      #
      # H2ConsoleAbsentIntegrationTest is the tripwire: it fails if the module ever
      # lands, so the conversation happens at review time rather than in an incident.
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mvc:
    async:
      # SSE stream lifetime cap, matching SseSessionEventPublisher.EMITTER_TIMEOUT_MILLIS (EOP-20, ADR-034).
      # The servlet container closes a connection that has been open for this many milliseconds even if
      # the heartbeat sweep has not yet triggered the onTimeout callback. 600 000 ms = 10 minutes.
      request-timeout: 600000

eop:
  web:
    # Peers whose X-Forwarded-For header is believed, as literal addresses or CIDR
    # blocks (ADR-021). Empty means nobody, so the header is ignored and the real
    # peer address is used instead. That is the correct answer everywhere the
    # application is reached without a reverse proxy in front of it: locally, in
    # tests, and from a sibling container. Before EOP-26 the header was read
    # unconditionally, which let any caller nominate its own rate-limiter bucket and
    # rotate it once per guess, defeating the join throttle ADR-019 depends on.
    #
    # The deployed value is set on the app service in compose.app.yml, beside the
    # fixed address of the proxy it has to match. A malformed entry fails startup.
    trusted-proxies: []

    # Maximum successful session creations one client address may make in a 60-second
    # window before receiving HTTP 429 (EOP-19, ADR-033). The default of 5 is the
    # production limit. Override to Integer.MAX_VALUE in
    # src/test/resources/application.properties so the shared Spring context is not
    # exhausted across integration tests (all of which call createSession).
    # Body-size cap: Caddy enforces request_body { max_size 16KB } on /api/* before
    # requests reach the application. There is no application-level body cap; direct
    # access bypasses Caddy and is unprotected. See ADR-033 for the rationale.
    session-creation-limit: 5

  # Feature flags (ADR-013). Every flag is off here so that forgetting to think
  # about one fails closed. A flag is bound at startup, so flipping it restarts the
  # application; in a container that means setting EOP_FEATURES_SESSION_LIFECYCLE
  # in the environment the container starts with, then
  # docker compose -f compose.app.yml up -d (ADR-016).
  features:
    # Session create, join, state, event stream and start (EOP-10). While this is
    # false neither the controller bean nor the create-session, join-session,
    # session-state and start-session beans exist, so every /api/v1/sessions path
    # returns the framework's own 404, nothing in the application can open or
    # mutate a session, and nothing else changes. resolve-player stays ungated on
    # purpose: it only reads, and the trick-play use cases depend on it (EOP-48,
    # ADR-013).
    #
    # Only the literal true turns this on. on, yes and 1 all read as off, because
    # the conditions carry havingValue = "true" -- flipping it with anything but
    # true is a silent no-op, which is the price of the flag failing closed.
    session-lifecycle: false

    # Dealing the deck, playing a trick and resolving the winner (EOP-14). While this is
    # false the deal-hands, read-own-hand, play-card, trick-state, resolve-trick and
    # get-score beans do not exist, so nothing in the application calls the ports that write a hand, a
    # trick or a play, even though the tables and the ports are already there.
    # TrickController and ScoreController are gated on this same flag, so all six of
    # /deal, /hand, /plays, /tricks/current, /tricks/current/resolve and /score return
    # the framework's own 404 while it is off.
    #
    # It stays false on merge, and the feature is complete: EOP-14 Slice E finished the
    # rules, added the state-of-play read that tells a client whose turn it is, and
    # published hand-dealt, card-played and trick-resolved. What is missing is not
    # gameplay. Two things must land before this becomes true, both recorded as
    # predecessors in ADR-028: ADR-026, which is still Proposed and would give the
    # game-affecting writes the audit logging observability.md requires; and
    # EOP-15, which scores a hand. Its first two slices have landed -- the scoring
    # rule in the domain, and the read that serves it at GET /score -- so a score
    # can now be derived and shown. Its third has not, so a player could still play
    # every card and the session would report IN_PROGRESS for ever, which is the
    # clause that keeps EOP-15 a predecessor (ADR-030, ADR-031). Do
    # not flip this without them. The third predecessor, EOP-48 -- which fixed the
    # sibling flag above failing open for want of a havingValue -- is discharged by
    # commit 34d30d7, and this flag's own conditions have carried havingValue since
    # 56c31b1, so the same caveat applies here: only the literal true turns it on.
    trick-play: false

  # Expired-session sweep configuration (ADR-036). These are infrastructure
  # toggles, not feature flags — they belong under eop.* directly rather than
  # eop.features.*. The sweep bean is only active when eop.features.session-lifecycle
  # is true; these values are ignored while the flag is off.
  sweep:
    # Interval between sweep runs in milliseconds. Default: 1 hour.
    interval-ms: 3600000
    # Initial delay before the first sweep run in milliseconds. Default: 5 minutes.
    initial-delay-ms: 300000
