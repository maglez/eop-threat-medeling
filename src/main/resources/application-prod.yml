spring:
  datasource:
    url: ${DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  # The deployment unit is a container, so binding to loopback would provide no
  # isolation — only unreachability from outside the container. Isolation comes
  # from the security group and from which ports are published to the host.
  address: 0.0.0.0
  error:
    include-exception: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# Never expose API schema or Swagger UI in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
