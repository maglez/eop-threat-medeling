# Test-only datasource overrides.
# Keeps ./mvnw test hermetic: no DB_URL/DB_USERNAME/DB_PASSWORD env vars needed.
# (src/test/resources takes precedence over src/main/resources application.yml.)
spring.datasource.url=jdbc:h2:mem:eop-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
