# Elevation of Privilege — API contract.
#
# This file is the source of truth for the HTTP API (ADR-004). It is hand
# authored and committed BEFORE the controllers that implement it. springdoc
# generates /v3/api-docs at runtime for convenience only, and that generated
# document is disabled entirely in the production profile (ADR-012), so this
# file is the ONLY contract available to a client of the deployed instance.
#
# When an endpoint changes, this file changes in the same commit.

openapi: 3.1.0

info:
  title: Elevation of Privilege — threat modelling card game
  description: |
    HTTP API for the digital Elevation of Privilege threat modelling card game.

    The card deck is reference data: it is seeded by a database migration and is
    never mutated through this API. There is deliberately no POST, PUT, PATCH or
    DELETE on `/api/v1/cards`.

    The deck is the real Elevation of Privilege deck: 74 cards — Tampering
    starts at rank 3 and Elevation of Privilege starts at rank 5; all other
    suits run from rank 2 to Ace. © 2009 Microsoft Corporation, licensed
    Creative Commons Attribution 3.0 United States — see
    `docs/EoP_Microsoft_Docs/LICENCE-eop-deck.md`. Attribution is the only
    obligation the licence imposes, and it is discharged in the running
    application rather than only in this repository.

    ## Sessions and state authority

    A game is played in a session. A facilitator creates one and shares its join
    code; players join with that code and a display name. Every participant then
    holds an opaque identity token (ADR-015) sent in the `X-EoP-Player-Token`
    header. There is no account system and no authentication scheme, so that
    token is the only thing distinguishing one player from another.

    **The database is the only authority on state.** `GET /api/v1/sessions/{sessionId}`
    is the single endpoint that reports it, and the event stream at
    `/api/v1/sessions/{sessionId}/events` only announces *that* something changed
    — never *what* it changed to. A client that has missed events, reconnected,
    or survived a server restart re-reads the state endpoint; it does not replay
    an event history, because none is kept (ADR-014). This is why the recovery
    path and the first-load path are the same request.

    The session endpoints are gated by the `eop.features.session-lifecycle`
    feature flag (ADR-013) and are **on by default** as of EOP-25 (2026-08-16).
    While the flag is off the handlers do not exist and every path below returns 404.
  version: 1.0.0-SNAPSHOT
  license:
    name: Deck content — CC-BY-3.0 US (© 2009 Microsoft Corporation)
    url: https://creativecommons.org/licenses/by/3.0/us/

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: cards
    description: The threat card deck. Read only.
  - name: sessions
    description: |
      Game session lifecycle — create, join, read state, stream change
      notifications, start play. Gated by `eop.features.session-lifecycle`.
  - name: trick-play
    description: |
      Dealing the deck, playing a card into the current trick, resolving who
      took it, and reading the score derived from the play so far. Gated by
      `eop.features.trick-play`, a separate flag from
      `eop.features.session-lifecycle` (ADR-013), so trick play can be held back
      while the lobby is live.
  - name: game-over
    description: |
      Game Over screen: final leaderboard with STRIDE breakdown, and starting a
      new game with the same players. Gated by `eop.features.game-over` (ADR-013).

paths:
  /api/v1/cards:
    get:
      tags: [cards]
      summary: List threat cards
      description: |
        Returns a page of threat cards ordered by STRIDE suit, then by ascending
        rank. Ordering is fixed and not client controllable — the deck has a
        canonical order and a stable order makes the response cacheable and the
        tests deterministic.
      operationId: listCards
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of cards. An empty deck yields an empty `content` array, not a 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/cards/{cardId}:
    get:
      tags: [cards]
      summary: Get a single threat card
      operationId: getCard
      parameters:
        - name: cardId
          in: path
          required: true
          description: Identifier of the card.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sessions:
    post:
      tags: [sessions]
      summary: Create a game session
      description: |
        Creates a session in `LOBBY` status and admits the caller as its
        `FACILITATOR` at `seatOrder` 0.

        The response is the only time the identity token is ever transmitted in
        plaintext. A client that loses it has lost that player identity and must
        join again as a new player.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: The session was created and the caller admitted as facilitator.
          headers:
            Location:
              description: URI of the created session.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAdmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/sessions/{joinCode}/players:
    post:
      tags: [sessions]
      summary: Join a game session with its join code
      description: |
        Admits a new participant and assigns the next free `seatOrder`. Everyone
        already streaming from the session receives a `player-joined`
        notification.

        Seat order is assigned **once, here**, and is never recomputed. Play
        proceeds clockwise, so seat order is load-bearing game data: a player who
        disconnects and reconnects must not move around the table.

        The join code identifies the session but is not a credential for acting
        within it — the returned token is. Note that unlike the token, the join
        code deliberately does appear in a URL, because the facilitator's whole
        workflow is pasting a link into a chat window.
      operationId: joinSession
      parameters:
        - name: joinCode
          in: path
          required: true
          description: |
            The session's join code. Matched case-insensitively, and the
            Crockford base32 substitutions are applied before lookup, so `I` and
            `L` are read as `1` and `O` is read as `0`. A human transcribing a
            code from a video call is the expected input path.
          schema:
            type: string
            minLength: 6
            maxLength: 6
            pattern: '^[0-9A-Za-z]{6}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSessionRequest'
      responses:
        '200':
          description: The participant was admitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAdmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: |
            No joinable session has that code.

            This response is **byte-for-byte identical** whether the code never
            existed, was mistyped, or belonged to a session that has since been
            abandoned. Distinguishing those cases would turn this endpoint into
            an oracle confirming which codes are real, which is exactly the
            information a code-guessing attack needs.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/sessions/{sessionId}:
    get:
      tags: [sessions]
      summary: Read the current state of a session
      description: |
        **The reconnect endpoint.** Returns the whole session as stored in the
        database, with no reference to any in-memory structure. A player
        refreshing the page, recovering from a dropped connection, or arriving
        after a deployment restarted the container all use this one request, and
        all get the same answer.

        The join code is included so a facilitator who has reloaded can still
        share it. It is only ever returned to a caller already holding a valid
        token for this session.
      operationId: getSessionState
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /api/v1/sessions/{sessionId}/events:
    get:
      tags: [sessions]
      summary: Stream change notifications for a session
      description: |
        An `text/event-stream` connection (ADR-014) that emits a named event
        whenever the session changes.

        **These events are notifications, not state.** The payload identifies the
        session and the kind of change; it does not carry the new state. On
        receiving one, a client re-reads `GET /api/v1/sessions/{sessionId}`. That
        keeps a single source of truth and means the code path exercised after a
        change is the same one exercised on first load.

        There is no event history and no replay. `Last-Event-ID` is not honoured:
        a restart resets the counter, so an id from a previous process names an
        event this one cannot produce. Reconnection is a re-read, never a replay.

        The stream also carries periodic comment frames as a heartbeat. They are
        not events and have no payload. They exist because a silently dead
        connection is otherwise indistinguishable from an idle one — the EOP-8
        spike observed the server reporting two live subscribers after both
        clients had gone away.

        Event names emitted: `player-joined`, `game-started`, `hand-dealt`,
        `card-played` and `trick-resolved`. The last three accompany operations
        that are themselves behind the trick-play feature: where that feature is
        switched off those operations do not exist, so those names never appear.
        That is a deployment fact, not a difference in this contract. An event
        name is part of the wire contract and is never renamed.

        Delivery is best effort and is not ordered with respect to the HTTP
        response that caused it. An event may arrive after the response to the
        very request that produced it, and a client that made a change may be
        notified of its own change. Both are ordinary, because a client re-reads
        either way and arrives at the same state.

        The JSON carried in each `data:` field is the `SessionEvent` schema. It is
        not referenced with `$ref` here because the response body is a framed text
        stream, not a single JSON document, and saying otherwise would misdescribe
        the wire format to a code generator.
      operationId: streamSessionEvents
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The stream is open. It stays open until the client disconnects, the
            server shuts down, or the configured timeout elapses.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                playerJoined:
                  summary: A player joined, followed by a heartbeat
                  value: |
                    retry: 3000

                    event: player-joined
                    data: {"type":"player-joined","sessionId":"018f3c4a-...","occurredAt":"2026-08-05T10:15:30Z"}

                    : heartbeat
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/sessions/{sessionId}/start:
    post:
      tags: [sessions]
      summary: Start play
      description: |
        Moves the session from `LOBBY` to `IN_PROGRESS` and notifies everyone
        streaming with `game-started`.

        Facilitator only. Requires at least three players: the game is
        unplayable below three, which is a rule of the game rather than a
        configurable threshold.

        Dealing the deck is **not** part of this operation — it belongs to the
        trick-play story. Starting a session establishes that the lobby is
        closed, nothing more.
      operationId: startSession
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Play has started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/sessions/{sessionId}/end:
    post:
      tags: [trick-play]
      summary: End the session early
      description: |
        Moves the session from `IN_PROGRESS` to `COMPLETED` before all cards
        have been played, and publishes a `game-completed` event to all
        connected clients.

        Facilitator only. The score derived from the plays made so far remains
        readable from `GET /api/v1/sessions/{sessionId}/score`.

        This endpoint is gated by `eop.features.trick-play` (ADR-013). While
        that flag is off the handler does not exist and the path returns 404.
      operationId: endSession
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The session is now COMPLETED.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/sessions/{sessionId}/deal:
    post:
      tags: [trick-play]
      summary: Deal the deck
      description: |
        Deals the whole deck into hands, one per seated player, and fixes the
        opening lead.

        Facilitator only, and only once per session: a second call is a `409`.
        Requires the session to be joinable and to hold at least three players.

        **The deck is not dealt evenly.** All 74 cards are dealt, and the
        remainder goes to the lowest seats, so hands differ in size by at most
        one — three players receive 25/25/24, four receive 19/19/18/18, five
        receive 15/15/15/15/14, six receive 13/13/12/12/12/12. A
        trick is therefore one card from each seat that *still holds cards*, and
        the last trick of a hand is short.

        The opening lead is derived from the cards actually dealt, not fixed by
        rule: it belongs to the seat holding the lowest Tampering card. No
        particular rank is guaranteed to be in play, so a client must read the
        lead from the server rather than assume it.

        Returns no body. The caller reads its own hand from
        `GET /api/v1/sessions/{sessionId}/hand` and the session from
        `GET /api/v1/sessions/{sessionId}`, which keeps one code path per read.
      operationId: dealHands
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The deck has been dealt.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: |
            The deal produced no Tampering card, so no opening lead could be
            derived. This is a server fault, not a client one: the deck is fixed
            and every deal of it must contain Tampering cards, so reaching this
            means the deck loaded from the database is not the deck the rules
            assume. It is documented rather than hidden because a client that
            sees it should stop and report, not retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/sessions/{sessionId}/hand:
    get:
      tags: [trick-play]
      summary: Read the calling player's own hand
      description: |
        Returns the hand belonging to the player identified by the token, and no
        other. There is no operation that returns another player's hand or all
        hands at once, because a hand is secret for the whole of a game and an
        endpoint that could leak one would be the game's most valuable target.

        The path is singular — `hand`, not `hands` — as a deliberate departure
        from the plural-noun convention. It is a singleton sub-resource: *the
        caller's* hand. A plural would advertise a collection of every hand,
        which is precisely the operation that must never exist.

        `403` covers a token that is missing, unrecognised, or belongs to another
        session. `409` means the deck has not been dealt yet, which is a state
        problem rather than a missing resource: the session exists and the hand
        will exist after the deal.
      operationId: getOwnHand
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The caller's hand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/sessions/{sessionId}/plays:
    post:
      tags: [trick-play]
      summary: Play a card into the current trick
      description: |
        Plays one card out of the caller's own hand. If no trick is open this
        opens one; otherwise the card is appended to the trick in progress.

        **The seat is taken from the token, never from the body.** There is no
        `seatOrder` and no `playerId` in the request, and `suit` and `rank` are
        absent too: the card is resolved from the deck row named by `cardId` and
        then out of the caller's hand. Two earlier defects were exactly a
        caller-supplied seat, which let a player play out of somebody else's
        hand, and a caller-supplied suit and rank, which let a forged card take a
        trick.

        The server enforces turn order and follow-suit. The two are deliberately
        **not** the same status. Playing out of turn is a `409`: the request is
        coherent and would be legal later. Failing to follow the led suit while
        holding it, or naming a card that is not in the caller's hand, is a `422`:
        the request is well-formed and understood, but the card named cannot be
        played at all. `409` also covers a card already played into the trick and
        a hand that has not been dealt. `403` means the token is not the caller's
        seat's — including an attempt to act as another player. `404` means the
        session, the caller's membership of it, or the `cardId` names nothing that
        exists.

        Two requests racing to fill the same seat cannot both succeed — one gets
        `201`, the other `409`.

        Once every card dealt has been played the hand is over and this operation
        answers `409` with its own `title`, not the `422` that a card missing from
        an empty hand would otherwise produce. The distinction matters: `422`
        would say the caller named the wrong card, when in fact no card exists to
        name. `GET /api/v1/sessions/{sessionId}/tricks/current` reports the same
        fact as `handComplete`.

        Whose turn it is is not in this response, because it depends on which
        seats still hold cards. Read it from
        `GET /api/v1/sessions/{sessionId}/tricks/current` as `seatToPlay`.

        `threatLinked` is optional and defaults to `false`; an unlinked play is an
        ordinary outcome, not a degraded one. `components` and `notes` are the
        player's threat-modelling annotations and are bounded by this contract.
      operationId: playCard
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayCardRequest'
      responses:
        '201':
          description: |
            The card was played. The body is the trick as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trick'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such session, no such card, or the caller is not a member of the
            session. The three are one status on purpose: distinguishing them
            would tell an unauthenticated caller which session identifiers are
            real.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/sessions/{sessionId}/tricks/current:
    get:
      tags: [trick-play]
      summary: Read the state of play
      description: |
        Answers the three questions a client cannot answer from a `Trick` alone:
        whose turn it is, whether the current trick is complete, and which seat
        leads next. All three depend on which seats still hold cards — a fact
        about the whole session rather than about one trick — which is why they
        are published here and not on `Trick`.

        Any seated player may read this. Everything in the response is already
        public at the table: the cards played face up, the seat to play, the seat
        that took the trick. Cards still held appear nowhere;
        `GET /api/v1/sessions/{sessionId}/hand` is the only way to see a hand and
        it only ever shows the caller's own.

        `trick` is absent in exactly one situation: the cards have been dealt and
        nobody has led yet. `seatToPlay` is present even then, naming the seat
        that must lead.

        This is a read. It never opens, advances or resolves anything, and
        polling it changes nothing — though a client should prefer the event
        stream and read when notified.
      operationId: getTrickState
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current state of play.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrickState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            The cards have not been dealt yet, so there is no state of play to
            report.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/sessions/{sessionId}/tricks/current/resolve:
    post:
      tags: [trick-play]
      summary: Resolve the current trick
      description: |
        Works out which play took the completed trick and records it. The highest
        card of the led suit wins, unless any Elevation of Privilege card was
        played, in which case the highest of those wins. Ties are impossible
        because no card appears twice in a deck.

        Any seated player may resolve, not only the facilitator: the outcome is
        determined entirely by the cards already played, so there is nothing for
        the caller to decide and no reason to make the table wait on one person.

        A trick is complete when every seat that still holds cards has played
        into it — which for the last trick of a hand is fewer seats than the
        table. Resolving an incomplete trick, or one already resolved, is a
        `409`.

        Resolving also decides who leads next. The lead passes to the seat that
        took the trick if it still holds a card, and otherwise clockwise to the
        next seat that does — because the whole deck is dealt and hands are
        unequal, a winner can be out of cards while others are not. Handing the
        lead to a seat with no cards would open a trick nobody could play into.
        When no seat holds a card the hand is over and no seat leads;
        `GET /api/v1/sessions/{sessionId}/tricks/current` reports that as
        `handComplete`, and the seat that leads next as `nextLeaderSeat`.

        Scoring is not part of this operation.

        There is no `422` on this operation, and its absence is deliberate. The
        caller sends no body, so there is nothing about the request that can be
        well-formed and yet unprocessable: every refusal is either a matter of
        who is asking (`403`), what exists (`404`) or what state the trick is in
        (`409`). The server does keep one guard for a winning play that belongs
        to another trick, but no client input can reach it — a trick refuses such
        a winner in its own constructor — so publishing a status for it would
        promise a response no caller can provoke.
      operationId: resolveCurrentTrick
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The trick is resolved. `winningSeat` is now present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trick'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/sessions/{sessionId}/score:
    get:
      tags: [trick-play]
      summary: Read the score
      description: |
        The score of the session, in the shape of the printed Score Card: one
        row for every card that has been played, and a standing for every
        player at the table.

        The rule is the shipped one and nothing more. A card scores one point
        for the threat if its player connected the threat to the system, and
        one point for taking the trick. A play that connected no threat scores
        nothing for the threat, though its player can still take the trick
        with the card.

        Nothing here is accumulated. Every number is derived from the plays and
        from which play won each trick, so a score cannot drift from the game
        that produced it, and a client has nothing to assert a score of its
        own against.

        Any seated player may read it, and there is nothing to gate. Every card
        it names has already been played face up, and no card that any seat
        still holds appears in it — which is what separates this from
        `/hand`, the only route that shows a hand and one that only ever shows
        the caller's own. A stranger who guesses a session identifier is
        refused with `403` because they hold no credential for that session,
        not because the score itself is a secret.

        There is no `409` on this operation and its absence is deliberate. A
        score is reportable in every state a session can reach: before the deal
        it is everybody on nothing, which is a true answer rather than a
        missing one. Unlike the state of play, there is no state for which this
        read has to refuse.

        `rows` runs in trick order and, within a trick, in the order the cards
        were played. `standings` runs by position, and players level on points
        share a position rather than being separated arbitrarily.

        Polling this changes nothing, but a client should prefer the event
        stream and use this to recover.
      operationId: getScore
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The score of the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreSheet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          description: |
            The stored game contradicts itself and no score can be derived from
            it — a play attributed to a seat nobody occupies, or two tricks
            claiming one sequence number. Nothing a caller can change will help,
            so a client should stop rather than retry, and report the session
            identifier to whoever runs the service.

            The body deliberately names nothing: no player, play or trick
            identifier, and the same title and detail as any other server fault.
            The reason is recorded in the server's log, where it is useful to
            somebody who can act on it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/sessions/{sessionId}/leaderboard:
    get:
      tags: [game-over]
      summary: Read the final leaderboard
      description: |
        The final leaderboard for a completed session: one row per seated player,
        sorted by total score descending, with a per-STRIDE breakdown of captured
        cards.

        This endpoint is gated by `eop.features.game-over` (ADR-013). While that
        flag is off the handler does not exist and the path returns 404.

        Any seated player may read it. The leaderboard names only cards that have
        already been played face up, so it discloses nothing the table cannot
        already see. A stranger who guesses a session identifier is refused with
        `403` because they hold no credential for that session.

        The leaderboard is only available once the session is in `COMPLETED` state.
        Requesting it while the session is still in progress returns `409` — the
        resource exists but is not yet in the right state.

        Players with equal scores share the same rank (competition ranking). The
        `tied` flag makes this visible to a client rendering an ordinal without
        having to compare totals itself.
      operationId: getLeaderboard
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The leaderboard of the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            The session exists but is not yet completed. The leaderboard is only
            available once the last trick has resolved and the session is in
            `COMPLETED` state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/sessions/{sessionId}/new-game:
    post:
      tags: [game-over]
      summary: Start a new game with the same players
      description: |
        Clears all tricks and hands, re-deals the 74-card deck, and transitions
        the session back to `IN_PROGRESS`. All players remain in their original
        seats with the same seat numbers. The opening leader is the seat holding
        the 3 of Tampering.

        This endpoint is gated by `eop.features.game-over` (ADR-013). While that
        flag is off the handler does not exist and the path returns 404.

        Only the facilitator may call this. Any other seated player receives
        `403`. A stranger receives `403` for the same reason as every other
        operation.

        The session must be in `COMPLETED` status. Calling this while the session
        is `IN_PROGRESS` or `LOBBY` returns `409`.

        On success a `hand-dealt` event is published to the session's event
        stream, so all connected clients learn that the new hand is ready without
        polling.
      operationId: startNewGame
      security:
        - playerToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identifier of the session.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The new game was started. Clients should re-read the session state
            and their own hand.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            The session is not in a state where a new game can be started. The
            `detail` field names the current status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  schemas:
    StrideCategory:
      type: string
      description: |
        The STRIDE category the card belongs to. In the physical game this is the
        card's suit. `ELEVATION_OF_PRIVILEGE` is the trump suit.
      enum:
        - SPOOFING
        - TAMPERING
        - REPUDIATION
        - INFORMATION_DISCLOSURE
        - DENIAL_OF_SERVICE
        - ELEVATION_OF_PRIVILEGE

    Rank:
      type: string
      description: |
        The card's rank. Rank does double duty: it decides which card takes a
        trick, and it encodes a rough ordering of how commonly the threat is
        encountered, how much impact it has and how easy it is to exploit.
        Ordering is `TWO` lowest through `ACE` highest.
      enum: [TWO, THREE, FOUR, FIVE, SIX, SEVEN, EIGHT, NINE, TEN, JACK, QUEEN, KING, ACE]

    Card:
      type: object
      description: A single threat card. Immutable reference data.
      required: [cardId, suit, rank, rankSymbol, rankValue, threatPrompt]
      properties:
        cardId:
          type: string
          format: uuid
          description: Stable identifier. Seeded by migration, never regenerated.
        suit:
          $ref: '#/components/schemas/StrideCategory'
        rank:
          $ref: '#/components/schemas/Rank'
        rankSymbol:
          type: string
          description: How the rank is printed on the card face.
          examples: ['2', '10', 'J', 'A']
        rankValue:
          type: integer
          format: int32
          minimum: 2
          maximum: 14
          description: Numeric rank used for comparison. Ace is high, so 14.
        threatPrompt:
          type: string
          minLength: 1
          maxLength: 500
          description: The threat described on the card face.

    CardPage:
      type: object
      description: |
        A page of cards. This is a hand-authored envelope rather than Spring's
        `PageImpl` serialisation, because Spring Boot explicitly does not
        support serialising `PageImpl` to JSON as a stable contract.
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index of this page.
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size.
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Total cards across all pages.
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Total number of pages at this page size.

    ProblemDetail:
      type: object
      description: |
        RFC 9457 problem details (ADR-005). Every 4xx and 5xx response uses this
        shape. Served as `application/problem+json`.

        The production profile suppresses exception classes, messages,
        stacktraces and binding errors, so `detail` is deliberately terse there.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code, repeated for clients that only read the body.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference identifying this specific occurrence.

    SessionStatus:
      type: string
      description: |
        Lifecycle state of a session. Only `LOBBY` accepts new players, and only
        `LOBBY` can be started.
      enum:
        - LOBBY
        - IN_PROGRESS
        - COMPLETED
        - ABANDONED

    PlayerRole:
      type: string
      description: |
        `FACILITATOR` is whoever created the session. The role carries exactly one
        privilege — starting play — and is not transferable.
      enum:
        - FACILITATOR
        - PARTICIPANT

    ConnectionStatus:
      type: string
      description: |
        Whether the server currently believes this player is connected.

        Advisory only. A dead connection is discovered on the next failed write,
        so this can over-report `CONNECTED` between heartbeats. It is a display
        hint, never an input to a game rule.
      enum:
        - CONNECTED
        - DISCONNECTED

    DisplayName:
      type: string
      minLength: 1
      maxLength: 40
      description: |
        The name a player is known by at the table. Free text, unverified, and
        not unique — nothing stops two players choosing the same name. It is
        length-bounded and rejected if blank or containing control characters,
        because "anonymous" does not mean "unvalidated" (ADR-015).
      examples: ['Ada']

    JoinCode:
      type: string
      minLength: 6
      maxLength: 6
      pattern: '^[0123456789ABCDEFGHJKMNPQRSTVWXYZ]{6}$'
      description: |
        Six characters of Crockford base32, drawn from a cryptographically secure
        generator. The alphabet excludes `I`, `L`, `O` and `U`, so a code cannot
        be misread as a different valid code and cannot spell an unfortunate
        word.

        Always emitted in this canonical upper-case form. Input is normalised
        before lookup, so a code typed in lower case or with `I`/`L`/`O`
        substituted still resolves.
      examples: ['7QK2FM']

    CreateSessionRequest:
      type: object
      description: Everything needed to open a session — a name, and nothing else.
      required: [displayName]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'

    JoinSessionRequest:
      type: object
      description: Everything needed to join a session. The code travels in the path.
      required: [displayName]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'

    Player:
      type: object
      description: |
        One player at the table.

        Note what is absent: the stored hash of the player's identity token. It
        is never serialised, to any caller, under any flag. The only plaintext
        token any client ever sees is its own, in the admission response.
      required: [playerId, displayName, seatOrder, role, connectionStatus]
      properties:
        playerId:
          type: string
          format: uuid
          description: Stable identifier, assigned at join.
        displayName:
          $ref: '#/components/schemas/DisplayName'
        seatOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: |
            Position at the table, assigned once at join and never recomputed.
            Play is clockwise, so "who plays next" is derived from this: it is
            game data, not presentation ordering. It is not re-derived from a
            database sort or a join timestamp, because a reconnect must not move
            a player around the table.
        role:
          $ref: '#/components/schemas/PlayerRole'
        connectionStatus:
          $ref: '#/components/schemas/ConnectionStatus'

    SessionState:
      type: object
      description: |
        The complete state of a session as stored in the database. This is the
        only representation of state the API produces, and the only thing a
        reconnecting client needs to read.
      required: [sessionId, joinCode, status, players, createdAt, updatedAt]
      properties:
        sessionId:
          type: string
          format: uuid
          description: |
            Identifier of the session. Appears in shareable URLs and is not a
            secret — holding it grants nothing without a token.
        joinCode:
          $ref: '#/components/schemas/JoinCode'
        status:
          $ref: '#/components/schemas/SessionStatus'
        players:
          type: array
          minItems: 1
          maxItems: 6
          description: |
            Everyone admitted so far, in ascending `seatOrder`. Three is the
            minimum to start and six is the maximum the deck and the game
            support.
          items:
            $ref: '#/components/schemas/Player'
        createdAt:
          type: string
          format: date-time
          description: When the session was created.
        updatedAt:
          type: string
          format: date-time
          description: When the session last changed.

    SessionAdmission:
      type: object
      description: |
        Returned by both create and join. One schema rather than two, because the
        two payloads are identical and two names for one shape invite drift.

        This is the only response that carries a plaintext identity token.
      required: [playerToken, playerId, session]
      properties:
        playerToken:
          type: string
          description: |
            The caller's opaque identity credential, base64url-encoded (ADR-015).
            Sent back in `X-EoP-Player-Token` on every subsequent request. The
            server stores only a SHA-256 hash of it and cannot reissue it, so a
            client that loses it has lost that player identity.
          examples: ['t7Yc0Qw9Jt5mB3nR8vK1sZ2xL6hD4fA0pE9gU7iO3bY']
        playerId:
          type: string
          format: uuid
          description: |
            Which player in `session.players` the caller is. Supplied so the
            client does not have to infer its own identity by matching on display
            name, which is not unique.
        session:
          $ref: '#/components/schemas/SessionState'

    SessionEvent:
      type: object
      description: |
        The `data` payload of a server-sent event.

        Deliberately minimal. It says that something changed and in which
        session; it does not say what the new state is. State comes from
        `GET /api/v1/sessions/{sessionId}` and from nowhere else, so there is
        exactly one code path producing it (ADR-014).
      required: [type, sessionId, occurredAt]
      properties:
        type:
          type: string
          description: |
            The kind of change. Matches the SSE `event:` name.

            `hand-dealt`, `card-played` and `trick-resolved` are emitted by the
            trick-play operations; where that feature is switched off those
            operations do not exist and those names do not appear. `game-completed`
            is emitted when the session transitions to `COMPLETED`, either
            automatically when the last trick resolves or via the facilitator's
            early-end operation. A name in this enum is part of the wire contract
            and is never renamed.
          enum:
            - player-joined
            - game-started
            - hand-dealt
            - card-played
            - trick-resolved
            - game-completed
        sessionId:
          type: string
          format: uuid
          description: Which session changed.
        occurredAt:
          type: string
          format: date-time
          description: |
            Server time at which the change was published. Useful for ordering in
            a log; not a cursor, because there is no replay.

    Hand:
      type: object
      description: |
        The cards held by one player — always the caller.

        There is no schema for another player's hand and no schema for all hands,
        because there is no operation that returns either.

        `seatOrder` is deliberately absent. The caller already knows its own seat:
        it was given a `playerId` at admission and can find that player in
        `SessionState.players`. Repeating the seat here would be a second copy of
        game data that could disagree with the first.
      required: [handId, playerId, cardCount, cards]
      properties:
        handId:
          type: string
          format: uuid
          description: Identifier of the hand.
        playerId:
          type: string
          format: uuid
          description: |
            The player holding it. Always the caller — supplied so a client can
            assert it is looking at its own hand rather than assuming.
        cardCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
          description: |
            How many cards remain. Redundant with the length of `cards`, and
            present because hands are not equal: the whole deck is dealt, so the
            counts differ by one across the table and shrink at different rates
            once the short final trick is reached.
        cards:
          type: array
          maxItems: 20
          description: |
            The remaining cards, in no guaranteed order. A client that wants them
            sorted sorts them; the server does not promise a presentation order.
          items:
            $ref: '#/components/schemas/Card'

    TrickPlay:
      type: object
      description: |
        One card played into a trick by one seat.

        Every field here is decided by the server. In particular `seatOrder` is
        `readOnly`: it is derived from the identity token of the request that
        created the play and can never be supplied by a client. See
        `PlayCardRequest`.
      required: [trickPlayId, playerId, seatOrder, card, threatLinked, components, playedAt]
      properties:
        trickPlayId:
          type: string
          format: uuid
          description: Identifier of this play.
        playerId:
          type: string
          format: uuid
          description: Which player played it.
        seatOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          readOnly: true
          description: |
            The seat that played it, derived from the identity token of the
            request. Never accepted from a client.
        card:
          $ref: '#/components/schemas/Card'
        threatLinked:
          type: boolean
          description: |
            Whether the player linked this card to a component of the system under
            review. `false` is an ordinary outcome, not a degraded one — a player
            may play a card without finding a threat.
        components:
          type: array
          maxItems: 20
          description: |
            Names of the components the threat was linked to. Empty when
            `threatLinked` is `false`.
          items:
            type: string
            maxLength: 200
        notes:
          type: string
          maxLength: 2000
          description: |
            The player's free-text note about the threat. Absent when none was
            given; never an empty string.
        playedAt:
          type: string
          format: date-time
          description: Server time at which the play was recorded.

    Trick:
      type: object
      description: |
        One round of play: one card from each seat that still holds cards.

        Not necessarily one card from every seat at the table. Because the whole
        deck is dealt and hands are unequal, the last trick of a hand is short.

        This schema deliberately does not say whose turn it is, whether the trick
        is complete, or which seat leads next. Those three answers depend on which
        seats still hold cards, which is not part of a trick, and reporting them
        from here would mean guessing.
      required: [trickId, sequence, leaderSeat, plays]
      properties:
        trickId:
          type: string
          format: uuid
          description: Identifier of the trick.
        sequence:
          type: integer
          format: int32
          minimum: 1
          description: |
            Which trick this is within the hand, counting from one.
        leaderSeat:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: |
            The seat that led. For the first trick this is derived from the cards
            actually dealt, not fixed by the rules; afterwards it is decided when
            the previous trick is resolved.
        ledSuit:
          allOf:
            - $ref: '#/components/schemas/StrideCategory'
          description: |
            The suit that must be followed, taken from the leading card. Absent
            only on a trick that has just been opened and holds no plays yet.
        plays:
          type: array
          maxItems: 6
          description: |
            The cards played so far, in the order they were played — which starts
            at `leaderSeat` and runs clockwise.
          items:
            $ref: '#/components/schemas/TrickPlay'
        winningSeat:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: |
            The seat that took the trick.

            Absent until the trick is resolved, and its absence is the way to
            tell an unresolved trick from a resolved one. Highest card of
            `ledSuit` wins unless any Elevation of Privilege was played, in which
            case the highest of those wins.

    TrickState:
      type: object
      description: |
        The state of play across a whole session: the current trick, if there is
        one, together with the three answers that depend on which seats still
        hold cards.

        `Trick` reports none of those three, deliberately. A trick knows the
        cards played into it and nothing about the hands they came from, so
        answering from there would mean guessing. This schema is where the trick
        and the hands are put together.
      required: [complete, handComplete]
      properties:
        trick:
          allOf:
            - $ref: '#/components/schemas/Trick'
          description: |
            The current trick — the one in progress, or the last one resolved.

            Absent only between the deal and the first card led.
        seatToPlay:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: |
            The seat entitled to play the next card. A card from any other seat
            is a `409`.

            Absent when no card may be played at all: either the trick is
            complete and waiting to be resolved, or the hand is spent.
            `handComplete` tells those two apart.
        complete:
          type: boolean
          description: |
            Whether every seat that still holds cards has played into the current
            trick — which for the last trick of a hand is fewer seats than the
            table.

            `false` when there is no trick. A complete trick that has not been
            resolved is what `POST …/tricks/current/resolve` is for; once
            resolved, `complete` stays `true` and `trick.winningSeat` appears.
        nextLeaderSeat:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: |
            The seat that leads the next trick. Present only once the current
            trick is resolved, and only while some seat still holds a card.

            Usually the seat that took the trick, but not always: because the
            whole deck is dealt and hands are unequal, a winner can be out of
            cards while other seats are not, and the lead then passes clockwise
            to the next seat that still holds one.

            While present it equals `seatToPlay`, and publishing both is
            intentional rather than redundant: they are computed from different
            authorities — one from the cards in the trick, one from the seat the
            session records as leading — so a disagreement is a defect a client
            is entitled to notice.
        handComplete:
          type: boolean
          description: |
            Whether every card dealt has been played. No further card can be
            played and no further trick can be opened.

            When this is `true` and the trick is resolved, the session
            transitions automatically to `COMPLETED` and a `game-completed`
            event is published. The facilitator may also end the session early
            via `POST /api/v1/sessions/{sessionId}/end` before all cards are
            played.

    ScoredPlay:
      type: object
      description: |
        One row of the Score Card: who played, what they played, what they
        connected it to, and why it scored.

        `threatPoint` and `trickPoint` are published separately rather than
        pre-summed, so that a reader can see why a row scored rather than only
        that it did. `points` is their sum and is never anything else.

        A row with `threatPoint` false and `trickPoint` true is ordinary, not
        an error: the player could not connect a threat, played the card
        anyway, and took the trick with it.
      required:
        - playerId
        - seatOrder
        - displayName
        - card
        - components
        - threatPoint
        - trickPoint
        - points
      properties:
        playerId:
          type: string
          format: uuid
          description: |
            The player who made the play. This, and not the display name, is
            what identifies them: two people may choose the same name.
        seatOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: The seat the play was made from.
        displayName:
          allOf:
            - $ref: '#/components/schemas/DisplayName'
          description: |
            The name the player chose, for display only. It is neither unique
            nor verified, so it must never be used as a key.
        card:
          allOf:
            - $ref: '#/components/schemas/Card'
          description: |
            The card that was played. It is named here because it is already
            face up on the table.
        components:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: |
            The parts of the system the player named when connecting the
            threat, in the order they gave them. This is the Score Card's
            `Component(s)` column, plural in the original because one threat
            may touch several. Empty when they named none, which does not stop
            a connected threat from scoring.
        notes:
          type: string
          maxLength: 2000
          description: |
            What the player typed about the threat: the Score Card's `Notes on
            Threat` column. Absent when they wrote nothing, never an empty
            string.
        threatPoint:
          type: boolean
          description: |
            Whether the play scored its point for connecting a threat to the
            system. False when the player connected none.
        trickPoint:
          type: boolean
          description: |
            Whether the play took the trick. Only present as true on one play
            of any resolved trick, and on no play of a trick still on the
            table.
        points:
          type: integer
          format: int32
          minimum: 0
          maximum: 2
          description: |
            What the row scored: one for the threat, one for the trick, so
            never more than two.

    Standing:
      type: object
      description: |
        One player's place in the game.

        Positions are competition ranked, so totals of 7, 5, 5 and 2 hold
        positions 1, 2, 2 and 4. A tie is shown as a tie and is never broken:
        the game has no tie-break rule, and inventing one here would report a
        result the table did not play.
      required: [playerId, seatOrder, displayName, points, position, tied]
      properties:
        playerId:
          type: string
          format: uuid
          description: The player this standing belongs to.
        seatOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: The seat they hold.
        displayName:
          allOf:
            - $ref: '#/components/schemas/DisplayName'
          description: The name they chose, for display only.
        points:
          type: integer
          format: int32
          minimum: 0
          description: |
            Their total across every row of the Score Card. Zero for a player
            who has played nothing, or nothing that scored.
        position:
          type: integer
          format: int32
          minimum: 1
          description: |
            Their place, competition ranked. Players level on points share a
            position, and the position after a shared one skips accordingly.
        tied:
          type: boolean
          description: |
            Whether another player holds the same total. Derivable from the
            standings as a whole, and published anyway so that a client
            showing one row does not have to recompute it and cannot get it
            wrong.

    ScoreSheet:
      type: object
      description: |
        The whole score of one session: the Score Card's rows, and the
        standings derived from them.

        This is every player's rows in one response, which the hand route is
        forbidden to be. The difference is what is in them: a score names only
        cards that have already been played, so it discloses nothing that the
        table cannot already see, whereas a hand names cards its holder alone
        is entitled to.

        Both lists are always present. Before any card is played `rows` is
        empty and every standing sits on nothing, which is the score of a game
        that has not started rather than a missing answer.

        There is no separate winner field. The winner is whoever holds
        position 1, and if that position is shared then the game is tied — a
        fact the standings already carry, and one that a second field could
        only contradict.
      required: [rows, standings]
      properties:
        rows:
          type: array
          maxItems: 74
          items:
            $ref: '#/components/schemas/ScoredPlay'
          description: |
            One row per card played, in trick order and, within a trick, in
            the order the cards were played. At most one per card in the deck.
        standings:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/Standing'
          description: |
            One standing per seated player, ordered by position and, among
            players level on points, by seat.

    LeaderboardRow:
      type: object
      description: |
        One player's row in the final leaderboard: their rank, name, total score,
        and a breakdown of captured cards by STRIDE category.

        `capturedBySuit` counts the cards the player captured (i.e. won the trick
        with) in each STRIDE category. A card the player played but did not win
        the trick with does not appear here. The map always contains all six
        STRIDE categories, with zero for any category where the player captured
        nothing.
      required: [playerId, seatOrder, displayName, points, position, tied, capturedBySuit]
      properties:
        playerId:
          type: string
          format: uuid
          description: The player this row belongs to.
        seatOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: The seat they hold.
        displayName:
          allOf:
            - $ref: '#/components/schemas/DisplayName'
          description: The name they chose, for display only.
        points:
          type: integer
          format: int32
          minimum: 0
          description: Their total score across the whole game.
        position:
          type: integer
          format: int32
          minimum: 1
          description: |
            Their place, competition ranked. Players level on points share a
            position, and the position after a shared one skips accordingly.
        tied:
          type: boolean
          description: Whether another player holds the same total.
        capturedBySuit:
          type: object
          description: |
            Count of cards captured (trick wins) per STRIDE category. All six
            categories are always present; zero means none captured.
          required:
            - SPOOFING
            - TAMPERING
            - REPUDIATION
            - INFORMATION_DISCLOSURE
            - DENIAL_OF_SERVICE
            - ELEVATION_OF_PRIVILEGE
          properties:
            SPOOFING:
              type: integer
              format: int32
              minimum: 0
            TAMPERING:
              type: integer
              format: int32
              minimum: 0
            REPUDIATION:
              type: integer
              format: int32
              minimum: 0
            INFORMATION_DISCLOSURE:
              type: integer
              format: int32
              minimum: 0
            DENIAL_OF_SERVICE:
              type: integer
              format: int32
              minimum: 0
            ELEVATION_OF_PRIVILEGE:
              type: integer
              format: int32
              minimum: 0

    Leaderboard:
      type: object
      description: |
        The leaderboard for a session: one row per seated player, sorted by total
        score descending (highest first). Players with equal scores share the same
        rank.

        This is the Game Over screen's primary data. It is available in any
        session state, not only `COMPLETED`.
      required: [rows, sessionStatus]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/LeaderboardRow'
          description: |
            One row per seated player, ordered by position and, among players
            level on points, by seat.
        sessionStatus:
          $ref: '#/components/schemas/SessionStatus'

    PlayCardRequest:
      type: object
      description: |
        A request to play one card.

        `seatOrder`, `playerId`, `suit` and `rank` are absent by design, not by
        omission. The seat and the player come from the `X-EoP-Player-Token`
        header; the suit and rank come from the deck row named by `cardId`. Two
        defects fixed during development were exactly a client-supplied seat,
        which let a player play out of another player's hand, and a
        client-supplied suit and rank, which let a forged card take a trick.

        A body carrying any of those fields is accepted and the field is
        ignored: nothing reads it. The seat and player published back in the
        `Trick` are always the token's, and the suit and rank are always the
        deck's, so a forged field changes nothing. Clients should not send them,
        and a future release may begin refusing them outright.
      required: [cardId]
      properties:
        cardId:
          type: string
          format: uuid
          description: |
            The card to play. Must be a card the caller currently holds; the
            server resolves it out of the caller's hand rather than trusting the
            request to describe it.
        threatLinked:
          type: boolean
          default: false
          description: |
            Whether this card was linked to a component of the system under
            review. Optional, and `false` is a perfectly ordinary answer.
        components:
          type: array
          maxItems: 20
          description: |
            Names of the components the threat applies to. Optional; omitting it
            and sending an empty array mean the same thing.
          items:
            type: string
            maxLength: 200
        notes:
          type: string
          maxLength: 2000
          description: The player's note about the threat. Optional.

  responses:
    BadRequest:
      description: |
        The request was malformed — for example a `cardId` that is not a UUID, a
        body that does not parse, or a display name that is blank or longer than
        forty characters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: No card exists with that identifier.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: |
        The `X-EoP-Player-Token` header is missing, unrecognised, or belongs to a
        different session — or it is valid but the player it identifies is not
        permitted to perform this operation — or the session has expired.

        403 rather than 401, deliberately. There is no authentication scheme
        here: no realm, no challenge, nothing a client could retry differently
        after being told to authenticate. A 401 is required to carry a
        `WWW-Authenticate` header, and emitting one would advertise a challenge
        that does not exist. The request was understood and refused, which is
        what 403 means. Session expiry is also a 403: the credential was once
        valid but the session it belonged to no longer exists. The `title` field
        distinguishes the cases: `"Player not recognised"` for an invalid token,
        `"Session expired"` for an expired session (ADR-036).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Conflict:
      description: |
        The request is valid but the session's current state does not allow it.
        The `title` distinguishes the cases, and there are fourteen of them, which
        is more than one status can imply on its own: play has already started,
        the table is full at six players, play cannot start with fewer than three,
        it is another seat's turn, the cards have already been dealt, the cards
        have not been dealt, every card dealt has been played and the hand is
        over, there is no trick to resolve, the trick is not complete yet, a trick
        is already open, the trick is already resolved, the seat has already
        played into this trick, the card has already been played into it, and
        every attempt to claim a seat lost its race to another joiner.

        That last case is the only one raised by contention rather than by state.
        A join retries a contested seat several times before giving up, so the
        response means the lobby filled underneath the caller while they were
        being seated — not that it was full when they asked. The distinction is
        invisible to the client and deliberately so: both answers are "read the
        session and decide", and the response names neither the session
        identifier nor the seat, because a joining caller supplied only a join
        code and never held either.

        Each of those is a separate `title` rather than a shared one, because a
        client's next move differs: wait for another player, deal, wait your turn,
        resolve, or stop. Collapsing them would leave the client guessing which
        wait it is in.

        Fourteen is the count of handlers in `GlobalExceptionHandler` that answer
        409, each with a distinct title. It is stated because an enumeration that
        silently omits a case is worse than no enumeration at all: this list named
        eleven and omitted the two about a play already in the trick until a
        review counted the handlers rather than trusting the prose, and it named
        thirteen while seat contention was still falling through to 500 (EOP-17).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    UnprocessableEntity:
      description: |
        The request is well formed and was understood, but the card it names
        cannot be played. The `title` distinguishes the cases: the caller holds
        the led suit and named a card of another suit, or the caller does not
        hold the card at all.

        The line between this and 409 is whether the same request could ever
        succeed. Playing out of turn is a 409 because the request is coherent and
        would be legal once the turn comes round. A card the caller does not hold
        is a 422 because no amount of waiting makes it playable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    SessionNotFound:
      description: |
        No session exists with that identifier.

        Note the asymmetry with joining by code: a `sessionId` is a UUID that
        nobody can usefully guess, so there is nothing to be gained by hiding
        whether one exists. A join code is six characters, so that endpoint
        deliberately does hide it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    TooManyRequests:
      description: |
        Too many requests from this source address and further attempts are
        refused for a period.

        Three controls can produce this response:

        - **Session creation limiter** — a single address may create at most
          `eop.web.session-creation-limit` sessions (default 5) per 60-second
          window. The slot is reserved before any database work, so a refused
          request never commits a row (ADR-033).
        - **Join attempt limiter** — too many failed join attempts from this
          source or against this code. A six-character code has roughly thirty
          bits of entropy, which is only unguessable while guessing is
          rate-limited — so this limiter is a primary security control rather
          than a courtesy (ADR-019).
        - **Subscriber cap** — too many concurrent SSE subscribers for a session
          or globally. The cap is not time-bounded, so no `Retry-After` header
          is emitted for this case (EOP-20, ADR-034).
      headers:
        Retry-After:
          description: |
            Seconds to wait before attempting again.
            Absent for subscriber-cap refusals, which are not time-bounded.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    RequestEntityTooLarge:
      description: |
        The request body exceeded the 16 KB limit enforced by the reverse proxy
        (Caddy `request_body { max_size 16KB }` on `/api/*`).

        This response is produced by the proxy, not the application. The body
        is a plain-text or empty response, not a problem detail.

    ServiceUnavailable:
      description: |
        No new lobby could be opened, because every join code the generator
        offered was already taken by a live session. The request was valid and
        nothing malfunctioned, so this is a capacity statement rather than an
        error: the same request is expected to succeed shortly.

        A six-character code carries roughly thirty bits of entropy, so a run of
        collisions across the whole attempt budget means the number of live
        lobbies is approaching what that code space comfortably bears. Unlike
        429, a caller cannot provoke this — which is why each occurrence is
        logged as an operational signal (EOP-17).

        The `detail` says nothing about join codes. The collision is between our
        own generator and our own data, and a caller who never sees a code being
        generated has no use for that mechanism.
      headers:
        Retry-After:
          description: Seconds to wait before attempting again.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  securitySchemes:
    playerToken:
      type: apiKey
      in: header
      name: X-EoP-Player-Token
      description: |
        The opaque identity credential issued at create or join (ADR-015).

        A custom header rather than `Authorization: Bearer`, because this is not
        OAuth and naming it so would invite the assumption that it behaves like
        one.

        It is **never** accepted as a query parameter, including on the event
        stream where `EventSource` would have made that convenient. A credential
        in a query string is a credential in the access log, in the browser
        history and on screen during a shared call. Clients that need to stream
        use `fetch`-based streaming, which can set headers.
